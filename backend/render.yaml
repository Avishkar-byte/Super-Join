services:
- type: web
  name: fact-knowledge-layer
  runtime: python
  region: oregon
  rootDir: backend
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: GEMINI_API_KEY
      sync: false
    - key: GROQ_API_KEY
      sync: false
    - key: DATABASE_PATH
      value: /opt/render/project/src/data/knowledge.db
    - key: PAGES_DIR
      value: /opt/render/project/src/data/pages
    - key: CORS_ORIGINS
      sync: false
    - key: PYTHON_VERSION
      value: "3.11.11"
  plan: free
  healthCheckPath: /health
